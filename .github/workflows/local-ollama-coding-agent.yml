name: Repository-owned autonomous development loop

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-owned-agent-${{ github.repository }}
  cancel-in-progress: false

jobs:
  develop:
    runs-on: self-hosted
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select persistent proposal branch
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin agent/own-model-development >/dev/null 2>&1; then
            git fetch origin agent/own-model-development
            git checkout -B agent/own-model-development origin/agent/own-model-development
          else
            git checkout -b agent/own-model-development
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Use repository-owned model only
        shell: bash
        run: |
          set -euo pipefail
          rm -f agent-status.md
          AGENT=''
          for candidate in tools/accessibility-agent tools/own-model-agent; do
            if [ -x "$candidate" ]; then AGENT="$candidate"; break; fi
          done
          if [ -n "$AGENT" ]; then
            "$AGENT" --task-file .github/agent-task.md
          else
            echo 'BLOCKED: repository-owned model CLI not implemented; no third-party model fallback.' >&2
            printf '%s\n' 'BLOCKED: own-model CLI/checkpoint unavailable; third-party model fallback prohibited.' > agent-status.md
            echo 'Deterministic validation will still run; this job will report BLOCKED afterward.'
          fi

      - name: Run repository tests
        shell: bash
        run: |
          set -euo pipefail
          if [ -d tests ] || find . -maxdepth 3 -name 'test_*.py' -not -path './.git/*' -print -quit | grep -q .; then python -m pytest -q; fi
          while IFS= read -r manifest; do [ -z "$manifest" ] || cargo test --manifest-path "$manifest"; done < <(find . -maxdepth 5 -name Cargo.toml -not -path './.git/*' | sort)
          git diff --check


      - name: Report unavailable repository-owned model
        if: always()
        shell: bash
        run: |
          if [ -f agent-status.md ] && grep -q '^BLOCKED:' agent-status.md; then
            cat agent-status.md
            echo 'BLOCKED: deterministic checks ran, but the repository-owned model is not implemented.'
            exit 2
          fi

      - name: Confirm no automatic publication
        run: |
          echo "PASS: local agent output is not committed or pushed automatically; review and publish explicitly."
