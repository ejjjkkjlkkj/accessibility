name: Continuous accessibility repository maintenance

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: accessibility-maintenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate repository inputs
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .maintenance-report
          report=.maintenance-report/report.txt
          {
            echo "Repository: ${GITHUB_REPOSITORY}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Event: ${GITHUB_EVENT_NAME}"
            echo "UTC: $(date -u +%FT%TZ)"
            echo "Physical hardware validation: NOT_PERFORMED"
            echo "UEFI/audio output validation: NOT_PERFORMED"
            echo
          } > "$report"
          failed=0
          while IFS= read -r -d '' file; do
            echo "JSON: $file" | tee -a "$report"
            if ! python -m json.tool "$file" >/dev/null 2>>"$report"; then failed=1; fi
          done < <(find . -path './.git' -prune -o -path './.venv' -prune -o -name '*.json' -print0)
          while IFS= read -r -d '' file; do
            if ! python -m py_compile "$file" >>"$report" 2>&1; then
              echo "Python syntax failure: $file" | tee -a "$report"
              failed=1
            fi
          done < <(find . -path './.git' -prune -o -path './.venv' -prune -o -name '*.py' -print0)
          if [ -f Cargo.toml ]; then
            echo "Rust workspace tests" | tee -a "$report"
            if ! cargo test --workspace --all-targets >>"$report" 2>&1; then failed=1; fi
          else
            rust_manifest_count=0
            while IFS= read -r -d '' manifest; do
              rust_manifest_count=$((rust_manifest_count + 1))
              echo "Rust crate tests: $manifest" | tee -a "$report"
              if ! cargo test --manifest-path "$manifest" >>"$report" 2>&1; then failed=1; fi
            done < <(find . -path './.git' -prune -o -path './target' -prune -o -name Cargo.toml -print0)
            if [ "$rust_manifest_count" -eq 0 ]; then
              echo "PARTIAL: no Cargo.toml found; Rust tests not discovered" | tee -a "$report"
            fi
          fi
          if [ -f go.mod ]; then
            echo "Go tests" | tee -a "$report"
            if ! go test ./... >>"$report" 2>&1; then failed=1; fi
          fi
          echo "RESULT=$([ "$failed" -eq 0 ] && echo PASS || echo FAIL)" | tee -a "$report"
          exit "$failed"

      - name: Preserve audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-maintenance-${{ github.run_id }}
          path: .maintenance-report/
          if-no-files-found: warn
          retention-days: 30
