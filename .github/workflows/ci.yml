name: Accessibility and ZERO CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: accessibility-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-audit:
    name: Repository and documentation audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required ZERO and agent-contract documents
        shell: bash
        run: |
          set -euo pipefail
          for f in AGENTS.md ZERO/README.md ZERO/LANGUAGE-AUDIT.md ZERO/REQUIREMENTS.md; do
            test -s "$f" || { echo "FAIL: missing or empty $f"; exit 1; }
            echo "PASS: $f"
          done

      - name: Check whitespace errors
        run: git diff --check

      - name: Check Markdown relative links
        shell: python {0}
        run: |
          import pathlib, re, sys
          root = pathlib.Path(".")
          failures = []
          ignored = {".git", ".github"}
          for path in root.rglob("*.md"):
              if any(part in ignored for part in path.parts):
                  continue
              text = path.read_text(encoding="utf-8", errors="replace")
              for target in re.findall(r"!?(?:\[[^\]]*\])\(([^)]+)\)", text):
                  target = target.strip().split()[0].strip("<>")
                  if not target or target.startswith(("http://", "https://", "mailto:", "#", "data:")):
                      continue
                  target = target.split("#", 1)[0].split("?", 1)[0]
                  if not target:
                      continue
                  resolved = (path.parent / target).resolve()
                  if not resolved.exists():
                      failures.append(f"{path}: broken relative link: {target}")
          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("PASS: Markdown relative links")

      - name: Parse PowerShell automation scripts
        shell: bash
        run: |
          set -euo pipefail
          if command -v pwsh >/dev/null 2>&1; then
            pwsh -NoProfile -Command '
              $files = Get-ChildItem -Path . -Recurse -Filter *.ps1 -File |
                Where-Object { $_.FullName -notmatch "[/\\](\.git|target|build|dist)[/\\]" }
              $failed = $false
              foreach ($file in $files) {
                $tokens = $null
                $parseErrors = $null
                [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
                if ($parseErrors.Count -gt 0) {
                  $parseErrors | ForEach-Object { Write-Error ("{0}: {1}" -f $file.FullName, $_.Message) }
                  $failed = $true
                }
              }
              if ($failed) { exit 1 }
              Write-Output ("PASS: parsed {0} PowerShell scripts" -f $files.Count)
            '
          else
            echo "PARTIAL: pwsh unavailable; PowerShell syntax was not checked"
          fi

      - name: Inventory implementation and tests
        shell: bash
        run: |
          set -euo pipefail
          echo "Repository inventory (no claim of hardware validation):"
          find . -maxdepth 3 -type f \( -name Cargo.toml -o -name pyproject.toml -o -name pytest.ini -o -name CMakeLists.txt -o -name Makefile \) -not -path './.git/*' -print
          if [ -f Cargo.toml ]; then
            if command -v cargo >/dev/null 2>&1; then
              cargo test --workspace --locked
            else
              echo "BLOCKED: Cargo manifest found but toolchain unavailable"
              exit 1
            fi
          else
            echo "PARTIAL: no root Cargo.toml; no Rust workspace test was inferred"
          fi
          if find . -path './.git' -prune -o -name '*.py' -print -quit | grep -q .; then
            python -m compileall -q .
            echo "PASS: Python syntax compilation"
          else
            echo "PARTIAL: no Python source files found"
          fi
          if [ -d tests ]; then
            if python -c "import pytest" >/dev/null 2>&1; then
              python -m pytest -q
            else
              python -m unittest discover -s tests
            fi
          else
            echo "PARTIAL: no root tests/ directory; inspect Rust manifests separately"
          fi

  security-baseline:
    name: Dependency and secret hygiene baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for accidentally committed common secret files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env|id_rsa|id_ed25519|credentials\.json|secrets\.json)$'; then
            echo "FAIL: suspicious secret-like filename tracked; inspect manually"
            exit 1
          fi
          echo "PASS: no common secret-like filenames detected"

  go-cross-platform:
    name: Go tests and vet (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go unit tests
        run: go test ./...

      - name: Run Go static analysis
        run: go vet ./...
