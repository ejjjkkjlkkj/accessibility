name: HAKER proof harness — multi-OS

on:
  push:
    branches: ["**"]
    paths:
      - "ZERO/HAKER-CASES.json"
      - "ZERO/HAKER*.md"
      - "tools/validate_haker_catalog.py"
      - "tests/test_haker_catalog.py"
      - "cmd/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/haker-multi-os-proof.yml"
  pull_request:
    paths:
      - "ZERO/HAKER-CASES.json"
      - "ZERO/HAKER*.md"
      - "tools/validate_haker_catalog.py"
      - "tests/test_haker_catalog.py"
      - "cmd/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/haker-multi-os-proof.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: haker-multi-os-${{ github.ref }}
  cancel-in-progress: true

jobs:

  haker-kali-container:
    name: HAKER harness / Kali Linux container
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify Kali Linux environment and run local checks
        shell: bash
        run: |
          docker pull kalilinux/kali-rolling:latest
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/work" \
            --workdir /work \
            kalilinux/kali-rolling:latest \
            bash -lc '
              set -euo pipefail
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3 golang-go ca-certificates
              printf "DISTRO="; . /etc/os-release; printf "%s\\n" "$PRETTY_NAME"
              printf "ARCH="; dpkg --print-architecture
              python3 tools/validate_haker_catalog.py ZERO/HAKER-CASES.json
              python3 -m unittest discover -s tests -p "test_haker_catalog.py" -v
              go test ./...
              go run ./cmd/catalog-validator data/resources.csv
            '

  haker-local-proof:
    name: HAKER harness / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [ubuntu-latest, windows-latest, macos-26]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Validate HAKER catalogue and safe defaults
        shell: bash
        run: python tools/validate_haker_catalog.py ZERO/HAKER-CASES.json

      - name: Test HAKER catalogue validator
        shell: bash
        run: python -m unittest discover -s tests -p 'test_haker_catalog.py' -v

      - name: Run repository Python unit tests
        shell: bash
        run: python -m unittest discover -s tests -v

      - name: Test Go packages
        shell: bash
        run: go test ./...

      - name: Validate resource catalogue
        shell: bash
        run: go run ./cmd/catalog-validator data/resources.csv

      - name: Record runner evidence
        shell: bash
        run: |
          python -c "import os,platform,sys; print('RUNNER=' + os.getenv('RUNNER_NAME','unknown')); print('OS=' + platform.platform()); print('ARCH=' + platform.machine()); print('PYTHON=' + sys.version.split()[0]); print('HAKER_SCOPE=local repository and synthetic catalogue checks only')"
          go version

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haker-evidence-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            ZERO/HAKER-CASES.json
            tools/validate_haker_catalog.py
            tests/test_haker_catalog.py
