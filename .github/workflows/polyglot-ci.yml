name: Polyglot CI (C, C++, Rust, Go, D, Ada, Zig, Nim, Swift, Pascal, Odin)
on:
  push:
    branches: [main, "work/**"]
    paths:
      - "cmd/**"
      - "components/**"
      - "crates/**"
      - "internal/**"
      - "src/**"
      - "projects/**"
      - "tests/**"
      - "scripts/**"
      - "docs/**"
      - "data/resources.csv"
      - "go.mod"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "cmd/**"
      - "components/**"
      - "crates/**"
      - "internal/**"
      - "src/**"
      - "projects/**"
      - "tests/**"
      - "scripts/**"
      - "docs/**"
      - "data/resources.csv"
      - "go.mod"
      - ".github/workflows/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-inventory:
    name: Validate eight language tracks and source inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_manifest.py
      - run: python scripts/validate_source_inventory.py
  go:
    name: Go screen-reader core and validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.23.x"}
      - run: go test ./...
      - run: go run ./cmd/catalog-validator data/resources.csv
  c:
    name: C11 core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S components/core-c -B build/core-c
      - run: cmake --build build/core-c --parallel 2
      - run: ctest --test-dir build/core-c --output-on-failure
  cpp-screenreader:
    name: C++ portable screen-reader core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: g++ -std=c++20 -Wall -Wextra -Werror -pedantic src/cpp/test_screenreader_core.cpp -o build-cpp-screenreader
      - run: ./build-cpp-screenreader
  pascal-screenreader:
    name: Free Pascal portable screen-reader core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y fp-compiler
      - run: fpc -Fu./src/pascal -FE/tmp src/pascal/test_screenreader_core.pas
      - run: /tmp/test_screenreader_core
  rust:
    name: Rust no_std core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path crates/accessibility-core/Cargo.toml
      - run: cargo check --manifest-path crates/accessibility-core/Cargo.toml --lib
  d:
    name: D event and navigation core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dlang-community/setup-dlang@v2
        with: {compiler: dmd}
      - working-directory: components/core-d
        run: dub test
  ada:
    name: Ada event and navigation core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gnat
      - working-directory: components/core-ada
        run: |
          gnatmake -gnata test_accessibility_event.adb
          ./test_accessibility_event
          gnatmake -gnata test_screenreader_cursor.adb
          ./test_screenreader_cursor
  zig:
    name: Zig event and navigation core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        with: {version: "0.13.0"}
      - run: zig test components/core-zig/src/accessibility_event.zig
      - run: zig test components/core-zig/src/screenreader_cursor.zig
  nim:
    name: Nim event and navigation core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y nim
      - run: nim c -r --hints:off components/core-nim/src/accessibility_event.nim
      - run: nim c -r --hints:off components/core-nim/src/screenreader_cursor.nim
  swift:
    name: Swift package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with: {swift-version: "6.0.3"}
      - working-directory: components/core-swift
        run: swift test
