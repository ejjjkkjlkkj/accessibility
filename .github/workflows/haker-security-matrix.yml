name: HAKER Offline Security Matrix

on:
  push:
    paths:
      - "agents/**"
      - "security/**"
      - "scripts/**"
      - "tests/**"
      - "docs/SECURITY-RED-TEAM.md"
      - "docs/AERL.md"
      - "README.md"
      - ".github/workflows/haker-security-matrix.yml"
  pull_request:
    paths:
      - "agents/**"
      - "security/**"
      - "scripts/**"
      - "tests/**"
      - "docs/SECURITY-RED-TEAM.md"
      - ".github/workflows/haker-security-matrix.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: haker-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-and-tests:
    name: Contract / Python ${{ matrix.python }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate agent contract JSON
        run: python -m json.tool agents/manifest.json
      - name: Validate security contract
        run: python scripts/validate_security_contract.py
      - name: Run security contract tests
        run: python -m unittest discover -s tests -p "test_security_contract.py" -v
      - name: Run HAKER scanner tests
        run: python -m unittest discover -s tests -p "test_haker_audit.py" -v
      - name: Run AERL evidence log tests
        run: python -m unittest discover -s tests -p "test_aerl.py" -v
      - name: Run AERL checkpoint tests
        run: python -m unittest discover -s tests -p "test_aerl_checkpoint.py" -v
      - name: Run unified AERL tool tests
        run: python -m unittest discover -s tests -p "test_aerl_tool.py" -v
      - name: Validate HAKER report schema and evidence
        run: python -m unittest discover -s tests -p "test_validate_haker_report.py" -v
      - name: Run bounded offline audit
        run: python scripts/haker_audit.py --json-out haker-audit-report.json
      - name: Validate generated HAKER report
        run: python scripts/validate_haker_report.py haker-audit-report.json
      - name: Compile Python security tools
        run: python -m py_compile scripts/validate_security_contract.py scripts/haker_audit.py scripts/validate_haker_report.py scripts/aerl.py scripts/aerl_checkpoint.py scripts/aerl_tool.py tests/test_aerl.py tests/test_aerl_checkpoint.py tests/test_aerl_tool.py
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haker-audit-${{ matrix.os }}-py${{ matrix.python }}
          path: haker-audit-report.json
          if-no-files-found: ignore
          retention-days: 14
