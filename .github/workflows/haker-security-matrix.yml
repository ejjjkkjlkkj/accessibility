name: HAKER Offline Security Matrix

on:
  push:
    paths:
      - "agents/**"
      - "security/**"
      - "scripts/**"
      - "tests/**"
      - "docs/SECURITY-RED-TEAM.md"
      - "docs/AERL.md"
      - "README.md"
      - ".github/workflows/haker-security-matrix.yml"
  pull_request:
    paths:
      - "agents/**"
      - "security/**"
      - "scripts/**"
      - "tests/**"
      - "docs/SECURITY-RED-TEAM.md"
      - ".github/workflows/haker-security-matrix.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: haker-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-and-tests:
    name: Contract / Python ${{ matrix.python }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Initialize unified AERL ledger
        run: python scripts/aerl_tool.py init --file .aerl-ci.events
      - name: Validate agent contract JSON
        run: python -m json.tool agents/manifest.json
      - name: Validate security contract
        run: python scripts/validate_security_contract.py
      - name: Run security contract tests
        run: python scripts/aerl_run.py --file .aerl-ci.events --kind test.security_contract -- python -m unittest discover -s tests -p "test_security_contract.py" -v
      - name: Run HAKER scanner tests
        run: python scripts/aerl_run.py --file .aerl-ci.events --kind test.haker_audit -- python -m unittest discover -s tests -p "test_haker_audit.py" -v
      - name: Run AERL evidence log tests
        run: python scripts/aerl_run.py --file .aerl-ci.events --kind test.aerl_core -- python -m unittest discover -s tests -p "test_aerl.py" -v
      - name: Run AERL checkpoint tests
        run: python scripts/aerl_run.py --file .aerl-ci.events --kind test.aerl_checkpoint -- python -m unittest discover -s tests -p "test_aerl_checkpoint.py" -v
      - name: Run unified AERL tool tests
        run: python scripts/aerl_run.py --file .aerl-ci.events --kind test.aerl_tool -- python -m unittest discover -s tests -p "test_aerl_tool.py" -v
      - name: Validate HAKER report schema and evidence
        run: python scripts/aerl_run.py --file .aerl-ci.events --kind test.haker_report_validator -- python -m unittest discover -s tests -p "test_validate_haker_report.py" -v
      - name: Run bounded offline audit
        run: python scripts/aerl_run.py --file .aerl-ci.events --kind security.haker_audit -- python scripts/haker_audit.py --json-out haker-audit-report.json
      - name: Validate generated HAKER report
        run: python scripts/aerl_run.py --file .aerl-ci.events --kind security.haker_report_validation -- python scripts/validate_haker_report.py haker-audit-report.json
      - name: Collect bounded reports into unified AERL ledger
        if: always()
        run: python scripts/aerl_tool.py collect --root . --file .aerl-ci.events
      - name: Verify final AERL evidence ledger
        if: always()
        run: python scripts/aerl_tool.py verify --file .aerl-ci.events
      - name: Write final AERL summary
        if: always()
        run: python scripts/aerl_tool.py summary --file .aerl-ci.events --out aerl-summary.json
      - name: Compile Python security tools
        run: python -m py_compile scripts/validate_security_contract.py scripts/haker_audit.py scripts/validate_haker_report.py scripts/aerl.py scripts/aerl_checkpoint.py scripts/aerl_tool.py scripts/aerl_run.py tests/test_aerl.py tests/test_aerl_checkpoint.py tests/test_aerl_tool.py tests/test_aerl_run.py
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haker-audit-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            haker-audit-report.json
            aerl-summary.json
            .aerl-ci.events
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  aggregate-evidence:
    name: Aggregate verified matrix evidence
    if: always()
    needs: contract-and-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Prepare artifact directory
        run: mkdir -p artifacts
      - name: Download per-matrix evidence
        uses: actions/download-artifact@v4
        with:
          pattern: haker-audit-*
          path: artifacts
          merge-multiple: false
      - name: Initialize master evidence ledger
        run: python scripts/aerl_tool.py init --file .aerl-run.events
      - name: Import each verified matrix ledger
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' ledger; do
            label="${ledger#artifacts/}"
            python scripts/aerl_tool.py import-ledger --source "$ledger" --file .aerl-run.events --source-label "$label"
          done < <(find artifacts -type f -name .aerl-ci.events -print0)
      - name: Collect bounded reports from matrix artifacts
        if: always()
        run: python scripts/aerl_tool.py collect --root artifacts --file .aerl-run.events
      - name: Verify master evidence ledger
        if: always()
        run: python scripts/aerl_tool.py verify --file .aerl-run.events
      - name: Write master evidence summary
        if: always()
        run: python scripts/aerl_tool.py summary --file .aerl-run.events --out aerl-run-summary.json
      - name: Upload master evidence ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aerl-master-evidence
          path: |
            .aerl-run.events
            aerl-run-summary.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
