name: Manifest validation

on:
  push:
    branches:
      - work/8-language-screenreader-uefi-os
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate all language/component records
        run: python scripts/validate_manifest.py
